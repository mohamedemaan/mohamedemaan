name: Update Dynamic Robot Greeting

on:
  schedule:
    # 5:00 AM IST (23:30 UTC) -> Good Morning
    # 12:00 PM IST (06:30 UTC) -> Good Afternoon
    # 4:00 PM IST (10:30 UTC)  -> Good Evening
    # 7:00 PM IST (13:30 UTC)  -> Good Night
    - cron: '30 23,6,10,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-greeting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate Time-Based Robot Guide
        run: |
          python scripts/generate_robot_guide.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/robot-guide.gif
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(robot): auto-update greeting for current time slot [skip ci]" && git push)
