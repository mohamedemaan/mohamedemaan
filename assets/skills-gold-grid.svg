<svg width="100%" height="auto" viewBox="0 0 820 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="tile-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B15" />
      <stop offset="50%" stop-color="#12141A" />
      <stop offset="100%" stop-color="#0A0B0F" />
    </linearGradient>
    <linearGradient id="gold-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#B8860B" />
      <stop offset="100%" stop-color="#785507" />
    </linearGradient>
    <linearGradient id="gold-text" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>


    <g transform="translate(34, 12)">
